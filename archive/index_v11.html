<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふたりの待ち時間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* レイアウト：スマホ1画面＝1場面。番号札（木の札）をモチーフにしたカード */
:root{
  --bg:#eef0ea; --surface:#fbfcf8; --ink:#1f2a3a; --sub:#5d6675; --line:#d3d8cd;
  --indigo:#23395d; --gold:#d99a1e; --pa:#2d63a8; --pb:#b4365f;
  --tag:#e9dcc0; --tag-ink:#3b2f1c; --ok:#2f7d4f; --ng:#c43d32;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161b22; --surface:#1f262f; --ink:#e8ebe4; --sub:#a3abb6; --line:#323b46;
  --indigo:#8fb0e0; --gold:#f0b545; --pa:#6fa1e3; --pb:#e57399;
  --tag:#4a3f2c; --tag-ink:#f3e7cc; --ok:#5fc08a; --ng:#ef6f62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b22; --surface:#1f262f; --ink:#e8ebe4; --sub:#a3abb6; --line:#323b46;
  --indigo:#8fb0e0; --gold:#f0b545; --pa:#6fa1e3; --pb:#e57399;
  --tag:#4a3f2c; --tag-ink:#f3e7cc; --ok:#5fc08a; --ng:#ef6f62; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.25;margin:8px 0 0;color:var(--indigo);text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:400;font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--sub);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--indigo);background:transparent;color:var(--indigo);padding:12px 16px;font-weight:700;min-height:48px}
button.main{background:var(--indigo);color:var(--surface);border-color:var(--indigo)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.chip{min-height:40px;padding:6px 14px;border-radius:999px;font-weight:400}
button.chip.on{background:var(--indigo);color:var(--surface)}
.grow{flex:1 1 0;min-width:0}
label{font-size:14px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.game{text-align:left;display:flex;flex-direction:column;gap:2px;border-color:var(--line);color:var(--ink);background:var(--surface);padding:16px}
.game b{font-family:var(--f-disp);font-weight:400;font-size:19px;color:var(--indigo)}
.game span{font-weight:400;font-size:14px;color:var(--sub)}
.scale{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.scale b{color:var(--ink)}
/* 番号札カード */
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{position:relative;flex:0 0 auto;width:96px;min-height:124px;border-radius:10px;background:var(--tag);color:var(--tag-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 6px 8px;box-sizing:border-box;
  border:2px solid transparent;border-top:8px solid var(--c,var(--indigo));font-weight:700}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg)}
.tag .num{font-family:var(--f-disp);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tag .who{font-size:13px}
.tag .memo{font-size:12px;font-weight:400;opacity:.85;text-align:center;word-break:break-all}
.tag.back .num{font-size:22px;opacity:.5}
.tag.bad{border-color:var(--ng)}
.tag.good{border-color:var(--ok)}
button.tag{cursor:pointer;font:inherit}
.slot{width:96px;min-height:124px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;box-sizing:border-box}
.hint{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.hint:last-child{border-bottom:0}
.hint i{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-family:var(--f-disp);font-size:44px;line-height:1.1;color:var(--indigo);font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .ng{color:var(--ng)}
.pa{color:var(--pa)} .pb{color:var(--pb)}
/* 言葉のチップ（順番は持たない） */
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips span{font-size:14px;padding:4px 12px;border-radius:999px;background:var(--tag);color:var(--tag-ink)}
/* メーター */
.meter{position:relative;height:56px;border-radius:28px;background:linear-gradient(90deg,var(--pa),var(--gold) 50%,var(--pb));opacity:.9;margin:24px 4px 28px}
.mk{position:absolute;top:-10px;bottom:-10px;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.mk span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;font-weight:700;color:var(--ink)}
.mk.guess{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.mk.guess span{top:auto;bottom:-24px}
.band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.55);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.reveal .band,.reveal .after{opacity:0}
.reveal.shown .band,.reveal.shown .after{opacity:1}
.reveal .mk.target span{opacity:0}
.reveal.shown .mk.target span{opacity:1}
input[type=range]{width:100%;accent-color:var(--indigo);height:40px}
.hintbox{font-family:var(--f-disp);font-size:22px;text-align:center;padding:12px;border-radius:10px;background:var(--tag);color:var(--tag-ink)}
.handoff{min-height:60vh;justify-content:center;text-align:center;align-items:center}
.handoff .big{font-size:34px}
/* せーので連想 */
.words{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.word{font-family:var(--f-disp);font-size:34px;padding:14px 20px;border-radius:12px;background:var(--tag);color:var(--tag-ink)}
.plus{font-family:var(--f-disp);font-size:28px;color:var(--sub)}
.homebar{display:flex;justify-content:center;margin-top:8px;padding-top:12px;border-top:1px dashed var(--line)}
button.ghost{border:1.5px solid transparent;color:var(--sub);font-weight:400;font-size:14px;text-decoration:underline;min-height:44px}
button.ghost.armed{color:var(--ng);border-color:var(--ng);text-decoration:none}
.chip small{opacity:.65;margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
/* 絵カード */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;min-height:84px;border-radius:10px;background:var(--tag);color:var(--tag-ink);border:2px solid transparent;box-sizing:border-box;min-width:0}
button.pc{font:inherit;cursor:pointer}
.pc .em{font-size:34px;line-height:1.1}
.pc .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.pc.txt .nm{font-size:15px}.pgrid.mini .pc.txt .nm,.hand .pc.txt .nm,.clue .pc.txt .nm{font-size:11px}
.pc.out{opacity:.22;filter:grayscale(1)}
.pc.sel{border-color:var(--ng);box-shadow:0 0 0 2px var(--ng)}
.pc.secret{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.pc.solo{min-height:0;padding:6px 12px;flex-direction:row;gap:6px}
.pgrid.mini{gap:6px}.pgrid.mini .pc{min-height:56px;padding:6px 2px}.pgrid.mini .em{font-size:24px}.pgrid.mini .nm{font-size:11px}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hand .pc{min-height:72px;padding:6px 2px}.hand .em{font-size:26px}.hand .nm{font-size:11px}
.clues{display:flex;flex-wrap:wrap;gap:12px}
.clue{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.clue .pc{width:68px;min-height:68px;padding:4px}.clue .em{font-size:24px}.clue .nm{font-size:11px}
.clue.diff .pc{transform:rotate(90deg)}
/* 順位当て */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg)}
.rk{font-family:var(--f-disp);color:var(--indigo);min-width:2.6em}
table.roles,table.rtable{width:100%;border-collapse:collapse;font-size:14px}
table.roles th,table.roles td,table.rtable th,table.rtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.roles .pt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rtable td.nw{white-space:nowrap}
table.rtable td:first-child{white-space:nowrap;width:3em}
table.rtable tr.hit td{background:var(--tag);color:var(--tag-ink);font-weight:700}
.panel.perfect{border:2px solid var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.score2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{display:flex;align-items:baseline;gap:6px;justify-content:center;padding:10px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.sc span{font-size:14px;font-weight:700}.sc b{font-family:var(--f-disp);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}.sc small{color:var(--sub)}
.sc.pa.up{border-color:var(--pa);box-shadow:0 0 0 2px var(--pa)}.sc.pb.up{border-color:var(--pb);box-shadow:0 0 0 2px var(--pb)}
.mini-rank{margin:4px 0 0;padding-left:1.6em;font-size:14px}
details.rlog{border-top:1px dashed var(--line);padding:8px 0}
details.rlog summary{cursor:pointer;font-size:14px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.hero.good{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.hero-em{font-size:68px;line-height:1.1}
.hero-t{font-family:var(--f-disp);font-size:28px;line-height:1.3;color:var(--indigo);text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:26px;color:var(--indigo);font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;color:var(--sub)}.stat span{font-size:12px;color:var(--sub)}
.logrow{padding:10px 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.logrow:first-of-type{border-top:0}
.logh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.logh .pt{margin-left:auto;font-weight:700;white-space:nowrap}
.mtrack{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pa),var(--gold) 50%,var(--pb));opacity:.85;margin:6px 4px}
.mtrack i{position:absolute;top:-5px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.mtrack i.g{background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.tl{display:flex;flex-direction:column;gap:10px}
.tlrow{display:flex;gap:10px;align-items:flex-start}
.tln{font-family:var(--f-disp);color:var(--indigo);min-width:1.2em;padding-top:20px}
.wchips span.bad{background:var(--ng);color:var(--surface)}
.center{align-items:center;text-align:center}
.pc.big-card{min-width:140px;padding:16px}.pc.big-card .em{font-size:56px}.pc.big-card .nm{font-size:18px}
.word{display:flex;flex-direction:column;align-items:center;gap:4px}
.wi{font-style:normal;font-size:40px;line-height:1}
.topic-em{font-size:56px;line-height:1;text-align:center}
@media (prefers-reduced-motion:no-preference){.hero-em{animation:pop .8s ease}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.count{font-family:var(--f-disp);font-size:120px;line-height:1;text-align:center;color:var(--indigo);padding:40px 0}
@media (prefers-reduced-motion:no-preference){
  .tag.flip{animation:flip .35s ease}
  .reveal .mk.target{transition:left 1s cubic-bezier(.3,.7,.3,1)}
  .reveal .band,.reveal .after,.reveal .mk.target span{transition:opacity .3s ease 1s}
  .count{animation:pop .9s ease}
}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@keyframes pop{from{transform:scale(1.4);opacity:.3}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>

  {name:"値段", words:["駄菓子","缶ジュース","コンビニ弁当","ランチ","映画のチケット","スニーカー","ゲーム機","スマホ","腕時計","軽自動車","高級車","家"]},

  {name:"時間の長さ", words:["まばたき","くしゃみ","カップ麺を待つ時間","歯みがき","昼休み","映画1本","東京から大阪まで新幹線","まる一日","夏休み","一年"]},

  {name:"明るさ", words:["新月の夜","ろうそく","豆電球","懐中電灯","部屋の電気","くもりの昼","自販機の光","花火","真夏の太陽","雷の光","満月","東京の夜景"]},

  {name:"東京からの遠さ", words:["隣の家","近所のコンビニ","横浜","箱根","名古屋","大阪","札幌","沖縄","ソウル","ハワイ","パリ","南極","月"]},
  {name:"歴史の古さ", words:["昨日","去年","スマホ","ゲーム機","テレビ","電話","江戸時代","お城","大仏","古墳","恐竜","地球"]},
  {name:"甘さ", words:["水","緑茶","ブラックコーヒー","トマト","りんご","バナナ","ミルクティー","チョコ","ケーキ","はちみつ","わたあめ","角砂糖"]},
  {name:"難しさ", words:["あいさつ","自転車","料理","運転免許","外国語","逆立ち","フルマラソン","資格試験","医者になる","宇宙飛行士","総理大臣になる"]},

  {name:"気まずさ", words:["エレベーターで二人きり","名前を忘れた","同じ服の人がいた","会話が止まる","人違いで手を振る","寝言を聞かれる","元恋人にばったり","親に恋人を紹介","上司と二人でランチ","自分の歌を録音で聞く"]},

  {name:"生き物の速さ", words:["カタツムリ","カメ","ナマケモノ","ニワトリ","人間","ウサギ","ネコ","馬","ライオン","チーター","ハヤブサ"]},
  {name:"食べ物の高級さ", words:["もやし","納豆","卵","牛丼","ハンバーガー","うなぎ","和牛","カニ","大トロ","キャビア","トリュフ","フォアグラ"]},

function drawLens(){ const it=S.ito; it.lens=pickOther(LENSES, it.lens); it.lensWords=shuffle(it.lens.words); }

function deal(){
  const it=S.ito, nums=new Set();
  while(nums.size < it.per*2) nums.add(1+Math.floor(Math.random()*100));
  it.cards = [...nums].map((num,k)=>({id:k, owner:k<it.per?0:1, i:(k%it.per)+1, num}));
  it.order=[]; it.revealed=0; it.peeks=[1,1]; drawLens();
}

    <span class="who">${nm(c.owner)}${circ(c.i)}</span>
    <span class="num">${face?c.num:"？"}</span>
  </${tagName}>`;
}

const R_ROLES = [["三連単",12,"上位3つが順番どおり"],["三連複",6,"上位3つの組み合わせ（順番は問わない）"],["馬単",5,"1位と2位が順番どおり"],["馬連",3,"1位と2位の組み合わせ（順番は問わない）"],["単勝",2,"1位が当たり"]];
const R_BONUS = 20;
function rJudge(a, p){
  const same = (x,y) => x.every(v=>y.includes(v));
  const perfect = a.every((v,i)=>v===p[i]);
  let role = null;
  if(a[0]===p[0] && a[1]===p[1] && a[2]===p[2]) role=0;
  else if(same(a.slice(0,3), p.slice(0,3))) role=1;
  else if(a[0]===p[0] && a[1]===p[1]) role=2;
  else if(same(a.slice(0,2), p.slice(0,2))) role=3;
  else if(a[0]===p[0]) role=4;
  return {role, perfect, pts:(role===null?0:R_ROLES[role][1]) + (perfect?R_BONUS:0)};
}
const roleName = j => j.perfect ? "完全的中" : j.role===null ? "ハズレ" : R_ROLES[j.role][0];

  <div class="score2">${[0,1].map(p=>`<div class="sc ${pc(p)} ${highlight===p?"up":""}"><span>${nm(p)}${lead===p?" ▲":""}</span><b>${r.pts[p]}</b><small>点</small></div>`).join("")}</div>`; }
function rPickerHtml(order){ const r=S.r, full=order.length>=5; return `
  <div class="panel"><p class="eyebrow">${esc(r.label)}</p>
    <ol class="rank">${[0,1,2,3,4].map(k=>`<li><span class="rk">${k+1}位</span>${order[k]!==undefined?`<b>${esc(r.items[order[k]])}</b>`:`<span class="sub">${k===order.length?"← 次はここ":"—"}</span>`}</li>`).join("")}</ol></div>
  ${full?"":`<div class="panel"><p class="eyebrow">${order.length+1}位にするものをタップ</p>
    <div class="row">${r.items.map((it,i)=>order.includes(i)?"":`<button class="chip" data-act="rPick" data-i="${i}">${esc(it)}</button>`).join("")}</div></div>`}
  <div class="row"><button class="grow" data-act="rUndo" ${order.length?"":"disabled"}>ひとつ戻す</button><button class="grow" data-act="rReset" ${order.length?"":"disabled"}>やり直し</button></div>`; }
const orderList = (items, order) => `<ol class="mini-rank">${order.map(i=>`<li>${esc(items[i])}</li>`).join("")}</ol>`;
V.rSetup = () => `
  <div><p class="eyebrow">順位当て</p><h2>あの人なら、どの順？</h2></div>
  <div class="panel"><p class="sub">「旅先で急に大雨。どうする？」のようなお題に、答える人が自分ならどうするかを5つ並べます。予想する人はその順位を5つ全部予想し、当たり方で役がつきます。点が入るのは予想した人。交代で答えて、最後に点数の多い方の勝ち！</p>
    <table class="roles">${R_ROLES.map(x=>`<tr><th>${x[0]}</th><td>${x[2]}</td><td class="pt">${x[1]}点</td></tr>`).join("")}
      <tr><th>完全的中</th><td>5つ全部が順番どおり</td><td class="pt">＋${R_BONUS}点</td></tr></table>
    <p class="sub">役は一番高いものだけ。</p></div>
  <div class="panel"><p class="eyebrow">回数（ひとり何回予想するか）</p>
    <div class="row">${[2,4,6].map(n=>`<button class="chip ${S.rRounds===n?"on":""}" data-act="rRounds" data-n="${n}">${n}回ずつ（全${n*2}回）</button>`).join("")}</div></div>
  <button class="main" data-act="rStart">はじめる</button>`;
V.rTopic = () => { const r=S.r, a=rAns(); return `
  <div class="topic-em">${r.icon}</div>
  <div><p class="eyebrow">${r.i+1}/${r.rounds}回目</p><h2>${esc(r.topic)}</h2></div>
  ${rScoreHtml()}
  <div class="panel"><p class="eyebrow">選択肢</p>${chips(r.items)}
    <p><b class="${pc(a)}">${nm(a)}さん</b>が、自分なら…で「${esc(r.label)}」に並べます。<b class="${pc(rPred())}">${nm(rPred())}さん</b>はそれを予想します。</p></div>

V.rAnswer = () => { const r=S.r, a=rAns(); return `

V.rPredict = () => { const r=S.r, a=rAns(), p=rPred(); return `
  <div><p class="eyebrow ${pc(p)}">${r.i+1}/${r.rounds}回目・予想する人：${nm(p)}さん</p><h2>${esc(r.topic)}</h2></div>

V.rReveal = () => { const r=S.r, a=rAns(), p=rPred(), j=r.last; return `
  <div><p class="eyebrow">${r.i+1}/${r.rounds}回目・答え合わせ</p><h2>${esc(r.topic)}</h2></div>
  <div class="panel ${j.perfect?"perfect":""}">
    <p class="eyebrow ${pc(p)}">${nm(p)}さんの予想</p>
    <p class="big ${j.pts?"ok":"ng"}">${j.perfect?"完全的中！":j.role===null?"ハズレ":R_ROLES[j.role][0]+" 的中"}</p>
    <p><b>＋${j.pts}点</b>${j.perfect?`（三連単 ${R_ROLES[0][1]}点 ＋ 完全的中ボーナス ${R_BONUS}点）`:j.role!==null?`（${R_ROLES[j.role][2]}）`:""}</p>
    ${j.perfect?`<p>5つ全部ぴったり。心が読めてる…！</p>`:""}
  </div>
  ${rScoreHtml(p)}
  <div class="panel" style="overflow-x:auto"><table class="rtable">
    <tr><th></th><th class="${pc(a)}">${nm(a)}さんの順位</th><th class="${pc(p)}">${nm(p)}さんの予想</th></tr>
    ${[0,1,2,3,4].map(k=>{ const hit=r.ans[k]===r.pred[k]; return `<tr class="${hit?"hit":""}"><td>${k+1}位</td><td>${esc(r.items[r.ans[k]])}</td><td>${esc(r.items[r.pred[k]])}${hit?" ◎":""}</td></tr>`; }).join("")}
  </table></div>

  <button class="main" data-act="rNext">${r.i+1<r.rounds?"次へ（出番を交代）":"結果を見る"}</button>`; };
V.rFinal = () => { const r=S.r, w = r.pts[0]===r.pts[1] ? -1 : (r.pts[0]>r.pts[1]?0:1);
  const per = p => r.log.filter(x=>x.pred===p);
  const best = p => { const l=per(p); if(!l.length) return "—"; const b=l.reduce((m,x)=>x.pts>m.pts?x:m); return b.pts?`${roleName(b.j)}（${b.pts}点）`:"—"; };
  const roles = p => { const l=per(p).filter(x=>x.pts>0); return l.length?l.map(x=>roleName(x.j)).join("、"):"なし"; };
  const hits = p => per(p).filter(x=>x.pts>0).length;
  return `
  ${hero(w<0?"🤝":"🏆", w<0?"引き分け！":`<span class="${pc(w)}">${nm(w)}さん</span>の勝ち！`, `順位当て・全${r.rounds}回`, true)}
  <div class="panel ${r.log.some(x=>x.j.perfect)?"perfect":""}">
    ${rScoreHtml(w<0?undefined:w)}
    <div style="overflow-x:auto"><table class="rtable">
      <tr><th></th><th class="pa">${nm(0)}</th><th class="pb">${nm(1)}</th></tr>
      <tr><td>的中した回数</td><td>${hits(0)}/${per(0).length}</td><td>${hits(1)}/${per(1).length}</td></tr>
      <tr><td>完全的中</td><td>${per(0).filter(x=>x.j.perfect).length}回</td><td>${per(1).filter(x=>x.j.perfect).length}回</td></tr>
      <tr><td>いちばんの当たり</td><td>${best(0)}</td><td>${best(1)}</td></tr>
      <tr><td>取った役</td><td>${roles(0)}</td><td>${roles(1)}</td></tr>
    </table></div>
  </div>
  <div class="panel"><p class="eyebrow">1回ごとの記録</p>
    <div style="overflow-x:auto"><table class="rtable">
      <tr><th>回</th><th>お題</th><th>予想</th><th>役</th><th>点</th></tr>
      ${r.log.map((x,k)=>`<tr class="${x.pts?"hit":""}"><td>${k+1}</td><td>${esc(x.topic)}</td><td class="nw ${pc(x.pred)}">${nm(x.pred)}</td><td class="nw">${roleName(x.j)}</td><td class="nw">${x.pts}</td></tr>`).join("")}
    </table></div></div>
  <div class="panel"><p class="eyebrow">こんな順で選んだね</p>
    ${r.log.map((x,k)=>`<details class="rlog"><summary>${k+1}. ${esc(x.topic)}　<span class="${pc(x.ans)}">${nm(x.ans)}さんの答え</span></summary>
      <div class="row" style="align-items:flex-start">
        <div class="grow"><p class="eyebrow ${pc(x.ans)}">${nm(x.ans)}さん（${esc(x.label)}）</p>${orderList(x.items,x.a)}</div>
        <div class="grow"><p class="eyebrow ${pc(x.pred)}">${nm(x.pred)}さんの予想</p>${orderList(x.items,x.p)}</div>
      </div></details>`).join("")}
  </div>
  <div class="row"><button class="main grow" data-act="rStart">もう一回</button><button class="grow" data-act="rSetup">設定を変える</button></div>`; };
function confetti(){
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  const box=document.createElement("div"); box.className="confetti";
  const cols=["var(--pa)","var(--pb)","var(--gold)","var(--ok)"];
  for(let i=0;i<80;i++){ const s=document.createElement("i"); s.style.left=Math.random()*100+"%"; s.style.background=cols[i%4];
    s.style.animationDelay=(Math.random()*0.8)+"s"; s.style.animationDuration=(2+Math.random()*1.5)+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 4500);
}

// ===== リザルトの共通部品 =====
// 大きな絵＋見出し。good=true で金色の枠（紙吹雪は操作側で confetti() を呼ぶ）
const hero = (emoji, title, sub, good) => `<div class="hero ${good?"good":""}"><div class="hero-em">${emoji}</div><p class="hero-t">${title}</p>${sub?`<p class="sub">${sub}</p>`:""}</div>`;
const statGrid = items => `<div class="stats">${items.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("")}</div>`;

// --- ② メーター当て
V.mResult = () => { const m=S.m, max=m.rounds*3, r=m.score/max;
  const title = r>=.8?"以心伝心":r>=.5?"いい感じのふたり":r>=.25?"伸びしろたっぷり":"ここから知り合おう";
  const em = r>=.8?"💞":r>=.5?"😊":r>=.25?"🌱":"🔍";
  const best = m.log.reduce((b,x)=>(!b||x.d<b.d)?x:b, null);
  const byTaker = p => m.log.filter(x=>x.taker===p).reduce((s,x)=>s+x.pts,0);
  return `
  ${hero(em, title, `メーター当て（${m.mode==="honne"?"本音を当てる":"ヒントで当てる"}）・${m.rounds}回`, r>=.5)}
  ${statGrid([["ふたりの合計",`${m.score}<small>/${max}</small>`],["ぴったり（3点）",m.log.filter(x=>x.pts===3).length+"回"],["いちばん近かった差",best?best.d:"—"]])}
  <div class="score2">${[0,1].map(p=>`<div class="sc ${pc(p)}"><span>${nm(p)}が当てた点</span><b>${byTaker(p)}</b></div>`).join("")}</div>
  ${best?`<div class="panel"><p class="eyebrow">ベストショット</p><p><b class="${pc(best.taker)}">${nm(best.taker)}さん</b>が「${esc(best.q)}」で差${best.d}！</p></div>`:""}
  <div class="panel"><p class="eyebrow">1回ごとの記録</p>
    ${m.log.map((x,k)=>`<div class="logrow">
      <div class="logh"><b>${k+1}.</b> ${esc(x.lo)} ↔ ${esc(x.hi)}<span class="pt ${x.pts?"ok":"ng"}">${x.pts}点</span></div>
      <p class="sub">${x.honne?`質問「${esc(x.q)}」・本音：${nm(x.giver)}さん`:`ヒント「${esc(x.q)}」・出題：${nm(x.giver)}さん`}</p>
      <div class="mtrack"><i class="t" style="left:${x.target}%"></i><i class="g ${pc(x.taker)}" style="left:${x.guess}%"></i></div>
      <p class="sub">${x.honne?"本音":"正解"} ${x.target} ／ ${nm(x.taker)}さんの予想 ${x.guess}（差${x.d}）</p></div>`).join("")}
  </div>
  <div class="row"><button class="main grow" data-act="mStart">もう一回</button><button class="grow" data-act="mSetup">設定を変える</button></div>`; };

// --- ③ せーので連想

  <div class="score2">${[0,1].map(p=>`<div class="sc ${pc(p)}"><span>${nm(p)}が当てた点</span><b>${by(p).reduce((s,x)=>s+x.pts,0)}</b></div>`).join("")}</div>
  <div class="panel"><p class="eyebrow">1問ごとの記録</p>

V.sResult = () => { const s=S.s, ok=!s.failed, x=s.log[s.log.length-1]; return `
  ${hero(ok?"🎉":"💥", ok?"成功！正解が残った":"失敗…正解を外しちゃった", `テーマ「${esc(s.theme)}」・出題 ${nm(x.giver)}さん → 当てる人 ${nm(x.taker)}さん`, ok)}

V.sFinal = () => { const s=S.s, r=s.wins/s.games;
  const title = r>=1?"ツーカーのふたり":r>=.5?"感覚が近いふたり":"見ている世界がちがうふたり";
  const asGiver = p => { const l=s.log.filter(x=>x.giver===p); return `${l.filter(x=>x.ok).length}/${l.length}`; };
  const simRate = Math.round(100*s.log.flatMap(x=>x.clues).filter(k=>k.t==="sim").length/Math.max(1,s.log.flatMap(x=>x.clues).length));
  return `
  ${hero(r>=1?"🏆":r>=.5?"🤝":"🌀", title, `似てる・違う・${s.games}ゲーム`, r>=.5)}
  ${statGrid([["成功",`${s.wins}<small>/${s.games}</small>`],["「似てる」で出した割合",simRate+"%"],["出したヒント",s.log.reduce((n,x)=>n+x.clues.length,0)+"枚"]])}
  <div class="score2">${[0,1].map(p=>`<div class="sc ${pc(p)}"><span>${nm(p)}が出題して成功</span><b>${asGiver(p)}</b></div>`).join("")}</div>
  <div class="panel"><p class="eyebrow">ゲームごとの記録</p>
    ${s.log.map((x,k)=>`<details class="rlog" ${k===s.log.length-1?"open":""}><summary>${k+1}. ${x.ok?"◎":"×"} テーマ「${esc(x.theme)}」　正解 ${x.secretCard[0]}${esc(x.secretCard[1])}　<span class="${pc(x.giver)}">出題 ${nm(x.giver)}</span></summary>${sTimeline(x)}</details>`).join("")}
  </div>

// ===== 操作 =====
const A = {
  home(){ go("home"); },
  handOk(){ S.hand.next(); },
  // ①
  itoSetup(){ newIto(S.ito?S.ito.per:2); go("itoSetup"); },
  itoPer(d){ S.ito.per=+d.n; render(); },
  itoStart(){ deal(); handoff(0, ()=>{ S.memoP=0; go("itoMemo"); }); },
  itoMemoDone(){ const p=S.memoP;
    if(p===0) handoff(1, ()=>{ S.memoP=1; go("itoMemo"); }); else go("itoField"); },
  itoLens(){ drawLens(); render(); },
  itoPeekGo(d){ const p=+d.p; S.ito.peeks[p]--; handoff(p, ()=>{ S.memoP=p; go("itoPeek"); }); },
  itoField(){ go("itoField"); },
  itoOrder(){ go("itoOrder"); },
  itoPut(d){ S.ito.order.push(+d.id); render(); },
  itoUndo(){ S.ito.order.pop(); render(); },
  itoReveal(){ S.ito.revealed=0; go("itoReveal"); },
  itoFlip(){ const it=S.ito; it.revealed++;
    if(it.revealed>=it.order.length){ const nums=it.order.map(id=>it.cards[id].num), ok=nums.every((v,i)=>!i||v>nums[i-1]);
      (S.itoLog=S.itoLog||[]).push({ok, n:nums.length}); render(); if(ok) confetti(); return; }
    render(); },
  itoAgain(d){ if(d && d.n) S.ito.per=+d.n; deal(); handoff(0, ()=>{ S.memoP=0; go("itoMemo"); }); },
  // ②
  mSetup(){ S.mRounds=S.mRounds||3; S.mMode=S.mMode||"hint"; go("mSetup"); },
  mMode(d){ S.mMode=d.k; render(); },
  mRounds(d){ S.mRounds=+d.n; render(); },
  mStart(){ S.m={mode:S.mMode||"hint", rounds:S.mRounds||3, r:0, score:0, log:[], pairs:shuffle(METER_PAIRS)}; mBeginRound(); },
  mHint(d){ const h=S.m.hints, i=h.indexOf(d.h);
    if(i>=0) h[i]=""; else if(!h[0]) h[0]=d.h; else h[1]=d.h; render(); },
  mPass(){ const m=S.m; if(!m.hints[0] && m.hints[1]) m.hints=[m.hints[1],""]; if(!m.hints[0]) return;
    handoff(taker(), ()=>go("mGuess")); },
  mHonneDone(){ handoff(taker(), ()=>go("mGuess")); },
  mHint2(){ S.m.used2=true; render(); },
  mDecide(){ const m=S.m; let pt=points(Math.abs(m.guess-m.target)); if(m.used2) pt=Math.min(pt,2);
    m.last=pt; m.score+=pt;
    m.log.push({lo:m.pair.lo, hi:m.pair.hi, honne:m.mode==="honne", q:m.mode==="honne"?m.item:(m.hints[0]+(m.used2?"＋"+m.hints[1]:"")), giver:giver(), taker:taker(), target:m.target, guess:m.guess, d:Math.abs(m.guess-m.target), pts:pt});
    go("mReveal");
    // 針が予想位置から正解へ動く演出
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ const rv=document.getElementById("rv"); if(!rv) return;
      rv.querySelector(".mk.target").style.left=m.target+"%"; rv.classList.add("shown"); })); },
  mNext(){ const m=S.m; m.r++; if(m.r>=m.rounds){ go("mResult"); if(m.score/(m.rounds*3)>=.5) confetti(); return; } mBeginRound(); },
  // ③
  wSetup(){ S.wRounds=S.wRounds||5; S.wMode=S.wMode||"w3"; go("wSetup"); },
  wMode(d){ S.wMode=d.k; render(); },
  wRounds(d){ S.wRounds=+d.n; render(); },
  wStart(){ const mode=S.wMode||"w3", n=S.wRounds||5;
    S.w={mode, rounds:n, r:0, score:0, log:[], deck: mode==="guess"?shuffle(TARGETS).slice(0,n):wBuildDeck(mode,n)}; wBeginRound(); },
  wCount(){ go("wCount"); const seq=["2","1","せーの！"];
    seq.forEach((s,i)=>TIMERS.push(setTimeout(()=>{ const el=document.getElementById("cnt"); if(!el) return;
      el.textContent=s; el.style.fontSize = s.length>1 ? "64px" : ""; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; }, 900*(i+1))));
    TIMERS.push(setTimeout(()=>go("wJudge"), 900*4)); },
  wHit(){ const w=S.w; w.last=1; w.score++; w.log.push({words:w.cur.words, ans:w.cur.ans, hit:true}); go("wAfter"); confetti(); },
  wMiss(){ const w=S.w; w.last=0; w.log.push({words:w.cur.words, ans:w.cur.ans, hit:false}); go("wAfter"); },
  wShowAns(){ S.w.showAns=true; render(); },
  wNext(){ const w=S.w; w.r++; if(w.r>=w.rounds){ go("wResult"); if(w.score/(w.mode==="guess"?w.rounds*5:w.rounds)>=.5) confetti(); return; } wBeginRound(); },
  gUseCard(){ S.w.own=""; go("wBoard"); },
  gUseOwn(){ if(S.w.own) go("wBoard"); },
  gOther(){ const w=S.w; w.t=pickOther(TARGETS, w.t); render(); },
  gNextHint(){ S.w.h++; render(); },
  gAsk(){ if(S.w.q>0) S.w.q--; render(); },
  gHit(){ const w=S.w; w.last=gPoints(w.h); w.score+=w.last; gLog(); go("wGuessAfter"); confetti(); },
  gGiveUp(){ S.w.last=0; gLog(); go("wGuessAfter"); },
  // ④
  sSetup(){ S.sGames=S.sGames||2; if(S.sTheme===undefined) S.sTheme=-1; if(S.sRefill===undefined) S.sRefill=true; go("sSetup"); },
  sTheme(d){ S.sTheme=+d.n; render(); },
  sRefill(d){ S.sRefill=d.n==="1"; render(); },
  sGames(d){ S.sGames=+d.n; render(); },
  sStart(){ S.s={games:S.sGames||2, g:0, wins:0, log:[], themeIdx:(S.sTheme===undefined?-1:S.sTheme), refill:S.sRefill!==false}; sNewGame(); handoff(sGiver(), ()=>go("sClue")); },
  sPickH(d){ S.s.pickH=+d.i; render(); },
  sGive(d){ const s=S.s; if(s.pickH<0) return; const c=s.hand.splice(s.pickH,1)[0]; s.clues.push({c, t:d.t, removed:[]});
    if(s.refill && s.pile.length) s.hand.push(s.pile.shift()); s.pickH=-1; s.sel=[]; go("sBoard"); },
  sSel(d){ const s=S.s, i=+d.i, k=s.sel.indexOf(i); if(k>=0) s.sel.splice(k,1); else if(s.sel.length<S_REMOVE[s.round]) s.sel.push(i); render(); },
  sRemove(){ const s=S.s; if(s.sel.length!==S_REMOVE[s.round]) return; s.removed.push(...s.sel);
    s.clues[s.round].removed = s.sel.map(i=>s.grid[i]);
    const endGame = ok => { s.log.push({theme:s.theme, secretCard:s.grid[s.secret], giver:sGiver(), taker:sTaker(), clues:s.clues.map(k=>({...k})), ok}); s.sel=[]; go("sResult"); if(ok) confetti(); };
    if(s.sel.includes(s.secret)){ s.failed=true; return endGame(false); }
    s.sel=[]; s.round++; if(s.round>=S_REMOVE.length){ s.wins++; return endGame(true); }
    handoff(sGiver(), ()=>go("sClue")); },
  sNext(){ const s=S.s; s.g++; if(s.g>=s.games){ go("sFinal"); if(s.wins/s.games>=.5) confetti(); return; } sNewGame(); handoff(sGiver(), ()=>go("sClue")); },
  // ⑤
  rSetup(){ S.rRounds=S.rRounds||2; go("rSetup"); },
  rRounds(d){ S.rRounds=+d.n; render(); },
  rStart(){ S.r={rounds:(S.rRounds||2)*2, i:0, pts:[0,0], log:[], topics:shuffle(RANK_TOPICS)}; rNewRound(); go("rTopic"); },
  rToAns(){ handoff(rAns(), ()=>{ S.r.cur="ans"; go("rAnswer"); }); },
  rPick(d){ const o=S.r[S.r.cur], i=+d.i; if(o.length<5 && !o.includes(i)) o.push(i); render(); },
  rUndo(){ S.r[S.r.cur].pop(); render(); },
  rReset(){ S.r[S.r.cur].length=0; render(); },
  rDone(){ const r=S.r;
    if(r.cur==="ans"){ if(r.ans.length<5) return; handoff(rPred(), ()=>{ r.cur="pred"; go("rPredict"); }); return; }
    if(r.pred.length<5) return; const j=rJudge(r.ans, r.pred); r.last=j; r.pts[rPred()]+=j.pts;
    r.log.push({topic:r.topic, label:r.label, items:[...r.items], a:[...r.ans], p:[...r.pred], ans:rAns(), pred:rPred(), j, pts:j.pts});
    go("rReveal"); if(j.perfect) confetti(); },
  rNext(){ const r=S.r; r.i++; if(r.i>=r.rounds){ go("rFinal"); confetti(); return; } rNewRound(); go("rTopic"); },
  // ホームに戻る（遊んでいる途中は2回タップで確定）
  homeAsk(){ if(SAFE_HOME.includes(S.screen) || S.homeArmed) return go("home");
    S.homeArmed=true; const b=document.getElementById("homeBtn"); if(b){ b.textContent="途中でやめてホームに戻る？（もう一度タップ）"; b.classList.add("armed"); } }
};

app.addEventListener("click", e => { const t=e.target.closest("[data-act]"); if(!t||t.disabled) return; const f=A[t.dataset.act]; if(f) f(t.dataset); });
app.addEventListener("input", e => { const id=e.target.id, v=e.target.value;
  if(id==="nameA") S.names[0]=v.trim()||DEFAULT_NAMES[0];
  if(id==="nameB") S.names[1]=v.trim()||DEFAULT_NAMES[1];
  if(id==="ownAns"){ S.w.own=v.trim(); const b=document.getElementById("ownBtn"); if(b) b.disabled=!S.w.own; }
  if(id==="hint1"||id==="hint2"){ S.m.hints[id==="hint1"?0:1]=v.trim(); const b=document.getElementById("passBtn"); if(b) b.disabled=!(S.m.hints[0]||S.m.hints[1]); }
  if(id==="guess"||id==="honne"){ const n=+v; if(id==="guess") S.m.guess=n; else S.m.target=n;
    const mk=app.querySelector(".mk.guess"); if(mk){ mk.style.left=n+"%"; mk.querySelector("span").textContent=(id==="guess"?"予想 ":"本音 ")+n; } }
});
function render(){ app.innerHTML = (V[S.screen]||V.home)() + (S.screen==="home" ? "" : `<div class="homebar"><button class="ghost" id="homeBtn" data-act="homeAsk">ホームに戻る</button></div>`); }
render();
</script>
</body>
</html>
